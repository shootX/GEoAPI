</div></header><div class="burger-panel"><a href="home.html#demo">დემო</a><a href="guide.html">დოკუმენტაცია</a><span class="btn btn-secondary is-disabled">მალე გაიხსნება</span></div><main id="content"><div class="wrap docs"><aside class="docs-side"><input data-doc-search type="search" placeholder="ძიება" aria-label="ძიება დოკუმენტაციაში"><h3>დაწყება</h3><a href="#start" aria-current="true">საწყისი ინსტრუქცია</a><a href="#auth">ავტორიზაცია და API გასაღებები</a><a href="#limits">მოთხოვნების ლიმიტები და შეცდომები</a><h3>ვიჯეტი</h3><a href="#widget">ვიჯეტის დამატება ვებსაიტზე</a><a href="#domains">დაშვებული დომენები</a><a href="#event">არჩევანის ცვლილების მოვლენა</a><h3>AI ასისტენტებით ინტეგრაცია</h3><a href="#cursor">Cursor</a><a href="#claude">Claude Code</a><a href="#codex">Codex</a><h3>API მეთოდები</h3><a href="#brands">ბრენდები <em>GET</em></a><a href="#models">მოდელები <em>GET</em></a><a href="#generations">თაობები <em>GET</em></a><a href="#modifications">მოდიფიკაციები <em>GET</em></a><a href="#modification">მოდიფიკაციის დეტალი <em>GET</em></a><a href="#coverage">კატალოგის სტატისტიკა <em>GET</em></a></aside><article><button class="btn btn-secondary docs-toggle" type="button" data-docs-toggle>დაწყება</button><p class="alert alert-warn" id="closed">საჯარო გაშვება ჯერ არ დაწყებულა. რეგისტრაცია ჯერ არ არის გახსნილი.</p><h1 class="h-app" id="start">საწყისი ინსტრუქცია</h1><p>შექმენით ანგარიში, დაადასტურეთ ელფოსტა და დაამატეთ პროექტი. შემდეგ აირჩიეთ ვიჯეტი ან სერვერული API.</p><h2 class="h2" id="auth">ავტორიზაცია და API გასაღებები</h2><p>საჯარო გასაღები <span class="mono">carapi_pk_</span> ვიჯეტისთვისაა. საიდუმლო <span class="mono">carapi_sk_</span> სერვერული მოთხოვნისთვისაა.</p><h2 class="h2" id="limits">მოთხოვნების ლიმიტები და შეცდომები</h2><p>60 მოთხოვნა წუთში და 10 000 წარმატებული მოთხოვნა UTC თვეში, თითო პროექტზე.</p><h2 class="h2" id="widget">ვიჯეტის დამატება ვებსაიტზე</h2><p>ჩასვით <span class="mono">&lt;carapi-filter&gt;</span> და საჯარო გასაღები.</p><h2 class="h2" id="domains">დაშვებული დომენები</h2><p>Origin არის პროტოკოლი, ჰოსტი და საჭიროებისას პორტი. ბილიკი და * არ მიიღება.</p><h2 class="h2" id="event">არჩევანის ცვლილების მოვლენა</h2><p>მოვლენა შეიცავს brand_id, model_id, year, body_type. generation_id და modification_id ამ ჯაჭვში null-ია.</p><h2 class="h2" id="cursor">Cursor</h2><p>წესების ფაილი .cursor/rules/carapi.mdc.</p><h2 class="h2" id="claude">Claude Code</h2><p>ინსტრუქცია CLAUDE.md ფაილში.</p><h2 class="h2" id="codex">Codex</h2><p>ინსტრუქცია AGENTS.md ფაილში.</p><h2 class="h2" id="brands">ბრენდები</h2><p>აბრუნებს ბრენდების სიას. მაგალითი განმარტებისთვისაა, ცოცხალი რიცხვი არ არის.</p><p class="get"><b>GET</b> /api/v1/brands</p><table class="data"><thead><tr><th>სახელი</th><th>ტიპი</th><th>აღწერა</th></tr></thead><tbody><tr><td data-label="სახელი">page</td><td data-label="ტიპი">integer</td><td data-label="აღწერა">გვერდი, ნაგულისხმევი 1</td></tr><tr><td data-label="სახელი">per_page</td><td data-label="ტიპი">integer</td><td data-label="აღწერა">50, მაქსიმუმ 100</td></tr></tbody></table><div class="code"><div class="code-bar"><div class="tabs"><button type="button" data-tab="curl" aria-selected="true">cURL</button><button type="button" data-tab="php" aria-selected="false">PHP</button></div><button class="btn btn-text" type="button" data-copy>კოპირება</button></div><pre data-panel="curl">curl https://car.socialsave.cc/api/v1/brands \

$ch = curl_init(&#039;https://car.socialsave.cc/api/v1/brands&#039;);</pre></div><h2 class="h2" id="models">მოდელები</h2><p class="get"><b>GET</b> /api/v1/brands/{slug}/models</p><h2 class="h2" id="generations">თაობები</h2><p class="get"><b>GET</b> /api/v1/models/{id}/generations</p><h2 class="h2" id="modifications">მოდიფიკაციები</h2><p class="get"><b>GET</b> /api/v1/generations/{id}/modifications</p><h2 class="h2" id="modification">მოდიფიკაციის დეტალი</h2><p class="get"><b>GET</b> /api/v1/modifications/{id}</p><h2 class="h2" id="coverage">კატალოგის სტატისტიკა</h2><p class="get"><b>GET</b> /api/v1/coverage</p></article><aside class="docs-toc"><p class="hint">ამ გვერდზე</p><a href="#start">საწყისი ინსტრუქცია</a><a href="#auth">ავტორიზაცია</a><a href="#brands">ბრენდები</a></aside></div></main><footer class="pub-footer"><span>© 2026 carapi</span><nav><a href="guide.html">დოკუმენტაცია</a><a href="login.html">შესვლა</a><a href="register.html">რეგისტრაცია</a><a href="terms.html">გამოყენების წესები</a><a href="privacy.html">კონფიდენციალურობა</a><a href="mailto:info@socialsave.cc">info@socialsave.cc</a></nav></footer></template><script src="proto.js"></script></body></html>
