# Push to main: run PHPUnit, then deploy /www/wwwroot/car.socialsave.cc.
# This file never reads or writes the server .env.

name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, curl, zip, bcmath, intl, sodium, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: |
            bash -s <<'EOF'
            set -e
            umask 002
            cd /www/wwwroot/car.socialsave.cc
            php artisan down --retry=15 || true
            bring_up() {
              status=$?
              php artisan up || true
              exit "$status"
            }
            trap bring_up EXIT
            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan up
            trap - EXIT
            EOF

      - name: Bring the site back up
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 2m
          script: |
            cd /www/wwwroot/car.socialsave.cc && php artisan up
