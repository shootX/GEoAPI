# Push to main: PHPUnit, then deploy DEPLOY_PATH (default /www/wwwroot/geoapi.ge).
# Pull requests run the test job only. This file never reads or writes the server .env.

name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, curl, zip, bcmath, intl, sodium, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit
        run: |
          php artisan key:generate --force
          vendor/bin/phpunit

  sdk:
    name: SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/sdk-js/package-lock.json

      - name: Test and build the SDK
        working-directory: packages/sdk-js
        run: |
          npm ci
          npm test
          npm run build

  mcp:
    name: MCP (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json

      - name: Build the SDK
        working-directory: packages/sdk-js
        run: |
          npm ci
          npm run build

      - name: Test and build the MCP server
        working-directory: packages/mcp-server
        run: |
          npm ci
          npm test
          npm run build

  cli:
    name: CLI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - name: Build the SDK
        working-directory: packages/sdk-js
        run: |
          npm ci
          npm run build

      - name: Test and build the CLI
        working-directory: packages/cli
        run: |
          npm ci
          npm test
          npm run build

  deploy:
    name: Deploy
    needs: [test, sdk, mcp, cli]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/www/wwwroot/geoapi.ge' }}
    steps:
      - name: Deploy over SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          envs: DEPLOY_PATH
          script: |
            bash -s <<'EOF'
            set -euo pipefail
            umask 002
            DEPLOY_PATH="${DEPLOY_PATH:-/www/wwwroot/geoapi.ge}"
            case "$DEPLOY_PATH" in
              /*) ;;
              *)
                echo "Deploy aborted: DEPLOY_PATH must be an absolute path. Refusing to mkdir or clone." >&2
                exit 1
                ;;
            esac
            if [ ! -d "$DEPLOY_PATH" ] || [ ! -e "$DEPLOY_PATH/.git" ]; then
              echo "Deploy aborted: '$DEPLOY_PATH' is missing or has no .git. Refusing to mkdir or clone." >&2
              exit 1
            fi
            cd "$DEPLOY_PATH"
            php artisan down --retry=15 || true
            bring_up() {
              status=$?
              php artisan up || true
              exit "$status"
            }
            trap bring_up EXIT
            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            npm ci --no-audit --no-fund --loglevel=error
            npm run build
            php artisan queue:restart
            php artisan up
            trap - EXIT
            EOF

      - name: Bring the site back up
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 2m
          envs: DEPLOY_PATH
          script: |
            bash -s <<'EOF'
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-/www/wwwroot/geoapi.ge}"
            if [ ! -d "$DEPLOY_PATH" ] || [ ! -e "$DEPLOY_PATH/.git" ]; then
              echo "Deploy aborted: '$DEPLOY_PATH' is missing or has no .git. Refusing to mkdir or clone." >&2
              exit 1
            fi
            cd "$DEPLOY_PATH"
            php artisan up
            EOF

      - name: Check https://geoapi.ge/up
        if: steps.deploy.outcome == 'success'
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://geoapi.ge/up || true)
          if [ "$code" != "200" ]; then
            echo "Health check failed: https://geoapi.ge/up returned '${code:-curl-error}', expected 200." >&2
            exit 1
          fi
